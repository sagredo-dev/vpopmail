; vdelivermail.ini

[main]
ensure_homedir_is_set_in_db = 1     ; default=1
  ; If pw_dir is blank, allocate/create the homedir and populate pw_dir.
ensure_homedir_exists_on_disk = 1 ; default=1
  ; If pw_dir is populated but its directory doesn't exist, recreate the directory tree.
execute_dotqmail=1 ; default=1

[logging]
log_source_hostname = demo ; default=hostname
verbose=0 ; default=0
tracking_header=X-Your-Tracking-Id ; default empty string

[file_log]
enabled = 1 ; default=0. 
;mandatory = 1 ; default=0. Proposed, not yet implemented
min_severity = debug ; default=info
path=log/vdelivermail.log ; default=<VPOPMAILDIR>/log/vdelivermail.log. chmod 660
format=pretty ; default=pretty. otherwise gelf

