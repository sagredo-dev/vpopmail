[main]
ensure_homedir_is_set_in_db=1
  ; If pw_dir is blank, allocate/create the homedir and populate pw_dir.
ensure_homedir_exists_on_disk=1
  ; If pw_dir is populated but its directory doesn't exist, recreate the directory tree.
execute_dotqmail=1
  ; whether to check for .qmail files

[logging]
log_source_hostname=
verbose=0
tracking_header= ; empty string, or absent, means no tracking header

[file_log]
enabled=1
mandatory=1
  ; mandatory=1, recommended, means a problem opening the log file will defer all deliveries.
  ; Sites that deliver to mail domain dirs with non-standard ownership will
  ; need to broaden permissions of the log file and its directory.
min_severity=info ; debug/info/warning/err/crit
path=@vdelivermail_log_dir@/vdelivermail.log
  ; usually 0660, vpopmail:vchkpw. Don't forget to adjust logrotate file.
format=pretty
  ; format=pretty is pretty-printed JSON. Readable without special tools.
  ; format=gelf is Graylog Extended Log Format: still JSON, but all in one line per record.
  ;   Best for grep, but uncomfortable without jq
